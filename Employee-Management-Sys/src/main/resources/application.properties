spring.application.name=Employee-Management-Sys

# ===========================
# Database Configuration
# Đọc giá trị từ biến môi trường, nếu không có thì dùng giá trị mặc định
# ===========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===========================
# JWT Secret (nếu dùng sau này)
# ===========================
# jwt.secret=${JWT_SECRET:default-secret-key}
